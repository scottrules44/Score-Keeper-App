<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Sports Score Tracker — Remote</title>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  .screen { display: none; min-height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  button {
    font: inherit; color: #fff; background: #1c1c1e; border: none;
    border-radius: 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active { filter: brightness(1.6); }

  /* ---- join ---- */
  #join { align-items: center; justify-content: center; gap: 22px; padding: 24px; }
  #join h1 { font-size: 26px; }
  #join .hint { color: #999; font-size: 15px; text-align: center; line-height: 1.5; }
  .slots { display: flex; gap: 12px; }
  .slot {
    width: 52px; height: 66px; border: 2px solid #444; border-radius: 10px;
    background: #111; display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700;
  }
  .slot.on { border-color: #0ff; }
  .pad { display: grid; grid-template-columns: repeat(3, 82px); gap: 10px; }
  .pad button { height: 60px; font-size: 26px; font-weight: 600; }
  .pad button.go { background: #0a84ff; font-size: 19px; }
  .pad button.go:disabled { opacity: .4; }
  #joinError { color: #ff5f1f; font-size: 15px; min-height: 20px; text-align: center; }
  #rejoin { background: none; border: 1px solid #0ff; color: #0ff; padding: 10px 18px; font-size: 16px; }

  /* ---- shared header ---- */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; gap: 10px;
  }
  .chip {
    display: flex; align-items: center; gap: 8px; border: 1px solid #444;
    border-radius: 18px; padding: 6px 14px; font-weight: 700; letter-spacing: 2px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #39ff14; } .dot.off { background: #ff5f1f; }
  .top button { padding: 8px 14px; font-size: 14px; }
  #hostAway { color: #ff5f1f; text-align: center; font-size: 13px; padding: 0 16px 6px; display: none; }

  /* ---- remote ---- */
  #remoteBody { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 12px; max-width: 560px; margin: 0 auto; width: 100%; }
  .pads { display: flex; gap: 12px; }
  .teamPad {
    flex: 1; border: 2px solid #fff; border-radius: 16px; background: #0b0b0c;
    display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px;
    cursor: pointer;
  }
  .teamPad:active { background: #17171a; }
  .teamPad .name { font-size: clamp(17px, 5vw, 26px); font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .teamPad .plusBig {
    border: 2px solid currentColor; background: transparent; font-weight: 800;
    min-width: 62%; padding: 2px 10px; font-size: clamp(22px, 7vw, 34px); line-height: 1.1;
  }
  .teamPad .score { font-size: clamp(72px, 27vw, 30vh); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .teamPad .tapHint { color: #555; font-size: 12px; }
  .incRow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .incRow button, .minus {
    border: 2px solid currentColor; background: transparent; font-weight: 700;
  }
  .incRow button { min-width: 58px; padding: 10px 12px; font-size: clamp(18px, 5vw, 24px); }
  .minus { min-width: 96px; padding: 8px 10px; font-size: clamp(20px, 6vw, 28px); }
  .setsRow { display: none; align-items: center; gap: 10px; font-weight: 700; }
  .setsRow button { border: 1px solid currentColor; background: transparent; padding: 4px 12px; font-size: 14px; }
  .midRow { display: flex; justify-content: space-around; gap: 10px; }
  .group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .group .lbl { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .group .btns { display: flex; gap: 10px; }
  .group button { padding: 10px 18px; font-size: 18px; border: 1px solid #555; background: transparent; }
  .bottomRow { display: flex; gap: 12px; }
  #hornBtn { flex: 1; background: #2a1400; border: 2px solid #ff5f1f; color: #ff5f1f; font-size: 20px; font-weight: 800; padding: 14px; }
  #resetBtn { border: 1px solid #666; background: transparent; color: #999; padding: 14px 18px; }

  /* ---- viewer ---- */
  #viewer { background: #000; }
  #viewerBody { flex: 1; display: flex; flex-direction: column; padding: 2vmin; }
  #vTopline { display: flex; justify-content: center; align-items: baseline; gap: 6vw; padding: 1vmin 0 0; }
  #vClock { font-size: 11vmin; font-weight: 800; font-variant-numeric: tabular-nums; }
  #vClock.done { color: #ff3131; }
  #vPeriod { font-size: 5vmin; font-weight: 700; color: #ccc; }
  #vTeams { flex: 1; display: flex; align-items: center; }
  .vTeam { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; }
  .vTeam .vName { font-size: 6vmin; font-weight: 800; }
  .vTeam .vScore { font-size: 38vmin; font-weight: 800; line-height: .95; font-variant-numeric: tabular-nums; }
  .vTeam .vSets { font-size: 4vmin; color: #aaa; display: none; }
  #vDivider { width: 2px; background: #222; align-self: stretch; margin: 4vmin 0; }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join" class="screen active">
  <h1>🏟 Sports Score Tracker</h1>
  <div class="hint">Enter the 4-digit code shown on the scoreboard<br>(tap “Remote” on the board to see it)</div>
  <div class="slots" id="slots">
    <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
  </div>
  <div class="pad" id="pad"></div>
  <div id="joinError"></div>
  <button id="rejoin" style="display:none"></button>
</div>

<!-- REMOTE -->
<div id="remote" class="screen">
  <div class="top">
    <button id="leaveBtn">‹ Leave</button>
    <div class="chip"><div class="dot" id="connDot"></div><span id="codeLabel"></span></div>
    <button id="toViewer">📺 Viewer</button>
  </div>
  <div id="hostAway">⚠️ Scoreboard is offline — it will catch up when it reconnects.</div>
  <div id="remoteBody">
    <div class="pads">
      <div class="teamPad" id="padHome">
        <div class="name"></div>
        <button class="plusBig">+</button>
        <div class="score">0</div>
        <div class="tapHint">tap +1</div>
        <div class="incRow"></div>
        <div class="setsRow"><button data-d="-1">−</button><span>Sets 0</span><button data-d="1">+</button></div>
      </div>
      <div class="teamPad" id="padAway">
        <div class="name"></div>
        <button class="plusBig">+</button>
        <div class="score">0</div>
        <div class="tapHint">tap +1</div>
        <div class="incRow"></div>
        <div class="setsRow"><button data-d="-1">−</button><span>Sets 0</span><button data-d="1">+</button></div>
      </div>
    </div>
    <div class="midRow">
      <div class="group">
        <div class="lbl" id="periodLabel">Period 1</div>
        <div class="btns">
          <button id="periodMinus">−</button>
          <button id="periodPlus">+</button>
        </div>
      </div>
      <div class="group" id="clockGroup">
        <div class="lbl" id="clockLabel">10:00</div>
        <div class="btns">
          <button id="clockToggle">▶</button>
          <button id="clockReset">↺</button>
        </div>
      </div>
    </div>
    <div class="bottomRow">
      <button id="hornBtn">📢 HORN</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<!-- VIEWER -->
<div id="viewer" class="screen">
  <div class="top">
    <button id="toRemote">🎮 Remote</button>
    <div class="chip"><div class="dot" id="vConnDot"></div><span id="vCodeLabel"></span></div>
    <button id="fullBtn">⛶ Full screen</button>
  </div>
  <div id="viewerBody">
    <div id="vTopline">
      <div id="vClock">10:00</div>
      <div id="vPeriod">Period 1</div>
    </div>
    <div id="vTeams">
      <div class="vTeam" id="vHome">
        <div class="vName"></div><div class="vScore">0</div><div class="vSets"></div>
      </div>
      <div id="vDivider"></div>
      <div class="vTeam" id="vAway">
        <div class="vName"></div><div class="vScore">0</div><div class="vSets"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import {
  getDatabase, ref, onValue, get, update, increment, serverTimestamp,
  push, set as fbSet, remove as fbRemove, onDisconnect
} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyByrVDVRX8uDAFikvlkMG3uu7Jlyr6F7kw',
  authDomain: 'sports-score-keeper.firebaseapp.com',
  databaseURL: 'https://sports-score-keeper-default-rtdb.firebaseio.com',
  projectId: 'sports-score-keeper',
  storageBucket: 'sports-score-keeper.firebasestorage.app',
  messagingSenderId: '342571857973',
  appId: '1:342571857973:web:4b39266be5d94274f2597c',
  measurementId: 'G-WEL1DEMS23',
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Google Analytics (works when served over https; ignore failures elsewhere)
let ga = null;
try {
  const mod = await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js');
  ga = { logEvent: mod.logEvent, analytics: mod.getAnalytics(app) };
} catch {}

function dayStamp() { return new Date().toISOString().slice(0, 10).replace(/-/g, ''); }
function logEvent(name) {
  try {
    update(ref(db), {
      [`analytics/totals/web/${name}`]: increment(1),
      [`analytics/daily/${dayStamp()}/web/${name}`]: increment(1),
    }).catch(() => {});
  } catch {}
  try { ga && ga.logEvent(ga.analytics, name); } catch {}
}

// ---- sport presets (mirror of src/sports.js) -------------------------------
const SPORTS = {
  generic:    { label: 'Generic',    emoji: '🏆', increments: [1],          periodLabel: 'Period',  maxPeriods: 99, sets: false, timerEnabled: true },
  basketball: { label: 'Basketball', emoji: '🏀', increments: [1, 2, 3],    periodLabel: 'Quarter', maxPeriods: 4,  sets: false, timerEnabled: true },
  football:   { label: 'Football',   emoji: '🏈', increments: [1, 2, 3, 6], periodLabel: 'Quarter', maxPeriods: 4,  sets: false, timerEnabled: true },
  soccer:     { label: 'Soccer',     emoji: '⚽', increments: [1],          periodLabel: 'Half',    maxPeriods: 2,  sets: false, timerEnabled: true },
  hockey:     { label: 'Hockey',     emoji: '🏒', increments: [1],          periodLabel: 'Period',  maxPeriods: 3,  sets: false, timerEnabled: true },
  volleyball: { label: 'Volleyball', emoji: '🏐', increments: [1],          periodLabel: 'Set',     maxPeriods: 5,  sets: true,  timerEnabled: false },
  pickleball: { label: 'Pickleball', emoji: '🥒', increments: [1],          periodLabel: 'Game',    maxPeriods: 3,  sets: true,  timerEnabled: false },
  baseball:   { label: 'Baseball',   emoji: '⚾', increments: [1],          periodLabel: 'Inning',  maxPeriods: 9,  sets: false, timerEnabled: false },
};
const sportMeta = (k) => SPORTS[k] || SPORTS.generic;

// ---- tiny synth (no audio files needed) ------------------------------------
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function beep() {
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.12, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.15);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.16);
  } catch {}
}
function hornSound() {
  try {
    const c = ctx(), g = c.createGain();
    g.gain.setValueAtTime(0.25, c.currentTime);
    g.gain.setValueAtTime(0.25, c.currentTime + 0.85);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.1);
    [185, 233].forEach((f) => {
      const o = c.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = f;
      o.connect(g); o.start(); o.stop(c.currentTime + 1.1);
    });
    g.connect(c.destination);
  } catch {}
}
const buzz = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---- state -----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
let code = null;
let game = null;
let unsub = null;
let serverOffset = 0;
let connected = false;
let lastHorn = null;
let lastScores = null;
let viewerMode = false;
let wakeLock = null;
let presenceRef = null;

onValue(ref(db, '.info/serverTimeOffset'), (s) => { serverOffset = s.val() || 0; });
onValue(ref(db, '.info/connected'), (s) => {
  connected = !!s.val();
  refreshConn();
});
const now = () => Date.now() + serverOffset;

function show(name) {
  document.querySelectorAll('.screen').forEach((el) => el.classList.remove('active'));
  $(name).classList.add('active');
}

// ---- join screen -----------------------------------------------------------
let digits = '';
const padKeys = ['1','2','3','4','5','6','7','8','9','⌫','0','Join'];
padKeys.forEach((k) => {
  const b = document.createElement('button');
  b.textContent = k;
  if (k === 'Join') { b.className = 'go'; b.disabled = true; }
  b.addEventListener('click', () => {
    buzz();
    if (k === '⌫') digits = digits.slice(0, -1);
    else if (k === 'Join') { if (digits.length === 4) join(digits); }
    else if (digits.length < 4) digits += k;
    renderSlots();
  });
  $('pad').appendChild(b);
});
function renderSlots() {
  [...$('slots').children].forEach((slot, i) => {
    slot.textContent = digits[i] || '';
    slot.classList.toggle('on', digits.length === i);
  });
  document.querySelector('.go').disabled = digits.length !== 4;
}
renderSlots();

async function join(c) {
  $('joinError').textContent = '';
  try {
    const snap = await get(ref(db, `rooms/${c}`));
    if (!snap.exists()) {
      $('joinError').textContent = `No game found with code ${c}.`;
      return;
    }
    code = c;
    localStorage.setItem('sk:webCode', c);
    history.replaceState(null, '', `?code=${c}`);
    subscribe();
    // Register presence so the board can show connected remotes.
    try {
      presenceRef = push(ref(db, `rooms/${c}/clients`));
      fbSet(presenceRef, serverTimestamp()).catch(() => {});
      onDisconnect(presenceRef).remove().catch(() => {});
    } catch {}
    logEvent('remote_joined');
    show(viewerMode ? 'viewer' : 'remote');
  } catch (e) {
    $('joinError').textContent = /permission/i.test(String(e))
      ? 'Permission denied — database rules not deployed yet.'
      : 'Connection problem — check your internet.';
  }
}

function subscribe() {
  if (unsub) unsub();
  unsub = onValue(ref(db, `rooms/${code}`), (snap) => {
    if (!snap.exists()) {
      leave('The scoreboard ended the session.');
      return;
    }
    game = snap.val();
    render();
  });
}

function leave(message = '') {
  if (unsub) { unsub(); unsub = null; }
  if (presenceRef) { fbRemove(presenceRef).catch(() => {}); presenceRef = null; }
  code = null; game = null; lastHorn = null; lastScores = null;
  digits = '';
  renderSlots();
  $('joinError').textContent = message;
  history.replaceState(null, '', location.pathname);
  show('join');
}

// ---- writes ----------------------------------------------------------------
function write(fields) {
  if (!code) return;
  update(ref(db, `rooms/${code}`), { ...fields, updatedAt: serverTimestamp() }).catch(() => {});
}
const team = (t) => (game && game[t]) || {};
function bump(t, d) {
  if (d < 0 && !(team(t).score > 0)) return;
  buzz();
  write({ [`${t}/score`]: increment(d) });
}
function bumpSets(t, d) {
  if (d < 0 && !(team(t).sets > 0)) return;
  buzz();
  write({ [`${t}/sets`]: increment(d) });
}
function bumpPeriod(d) {
  if (!game) return;
  const meta = sportMeta(game.sport);
  const next = Math.min(meta.maxPeriods, Math.max(1, (game.period || 1) + d));
  if (next !== game.period) { buzz(); write({ period: next }); }
}
function timerDisplayMs(t) {
  if (!t) return 0;
  if (!t.running) return t.remainMs || 0;
  const elapsed = Math.max(0, now() - (t.startAt || now()));
  if (t.countUp) return Math.min(t.durationMs, (t.remainMs || 0) + elapsed);
  return Math.max(0, (t.remainMs || 0) - elapsed);
}
function toggleClock() {
  const t = game && game.timer;
  if (!t) return;
  buzz();
  if (t.running) {
    write({ 'timer/running': false, 'timer/remainMs': timerDisplayMs(t) });
  } else {
    if (!t.countUp && (t.remainMs || 0) <= 0) return;
    if (t.countUp && (t.remainMs || 0) >= t.durationMs) return;
    write({ 'timer/running': true, 'timer/startAt': serverTimestamp() });
  }
}
function resetClock() {
  const t = game && game.timer;
  if (!t) return;
  buzz();
  write({ 'timer/running': false, 'timer/remainMs': t.countUp ? 0 : t.durationMs });
}
function resetGame() {
  if (!confirm('Reset the game?')) return;
  const t = game && game.timer;
  write({
    'home/score': 0, 'away/score': 0, 'home/sets': 0, 'away/sets': 0,
    period: 1, 'timer/running': false,
    'timer/remainMs': t ? (t.countUp ? 0 : t.durationMs) : 0,
  });
}

// ---- rendering -------------------------------------------------------------
const fmt = (ms) => {
  const total = Math.max(0, Math.round(ms / 1000));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
};

function refreshConn() {
  $('connDot').className = 'dot ' + (connected ? 'on' : 'off');
  $('vConnDot').className = 'dot ' + (connected ? 'on' : 'off');
}

function renderTeamPad(el, t, meta, key) {
  const color = t.color || '#fff';
  el.style.borderColor = color;
  el.querySelector('.name').textContent = t.name || key;
  el.querySelector('.name').style.color = color;
  el.querySelector('.plusBig').style.color = color;
  el.querySelector('.score').textContent = t.score || 0;
  el.querySelector('.score').style.color = color;
  const incRow = el.querySelector('.incRow');
  const want = meta.increments.join(',');
  if (incRow.dataset.incs !== want) {
    incRow.dataset.incs = want;
    incRow.innerHTML = '';
    const minus = document.createElement('button');
    minus.className = 'minus';
    minus.textContent = '−';
    minus.addEventListener('click', () => bump(key, -1));
    incRow.appendChild(minus);
    meta.increments.filter((i) => i !== 1).forEach((inc) => {
      const b = document.createElement('button');
      b.textContent = `+${inc}`;
      b.addEventListener('click', () => bump(key, inc));
      incRow.appendChild(b);
    });
  }
  incRow.querySelectorAll('button').forEach((b) => (b.style.color = color));
  const setsRow = el.querySelector('.setsRow');
  setsRow.style.display = meta.sets ? 'flex' : 'none';
  setsRow.style.color = color;
  setsRow.querySelector('span').textContent = `Sets ${t.sets || 0}`;
}

function render() {
  if (!game) return;
  const meta = sportMeta(game.sport);

  // sounds/haptics on changes from anywhere
  const scoreKey = `${team('home').score || 0}|${team('away').score || 0}`;
  if (lastScores !== null && lastScores !== scoreKey && viewerMode) beep();
  lastScores = scoreKey;
  if (lastHorn !== null && game.horn && game.horn !== lastHorn) hornSound();
  lastHorn = game.horn || 0;

  // remote
  $('codeLabel').textContent = code;
  $('hostAway').style.display = game.hostOnline === false ? 'block' : 'none';
  renderTeamPad($('padHome'), team('home'), meta, 'home');
  renderTeamPad($('padAway'), team('away'), meta, 'away');
  $('periodLabel').textContent = `${meta.periodLabel} ${game.period || 1}`;
  $('clockGroup').style.display = meta.timerEnabled ? 'flex' : 'none';
  $('clockToggle').textContent = game.timer && game.timer.running ? '⏸' : '▶';

  // viewer
  $('vCodeLabel').textContent = code;
  $('vPeriod').textContent = `${meta.periodLabel} ${game.period || 1}`;
  $('vClock').style.display = meta.timerEnabled ? 'block' : 'none';
  const vh = $('vHome'), va = $('vAway');
  [['home', vh], ['away', va]].forEach(([key, el]) => {
    const t = team(key);
    const color = t.color || '#fff';
    el.querySelector('.vName').textContent = t.name || key;
    el.querySelector('.vName').style.color = color;
    el.querySelector('.vScore').textContent = t.score || 0;
    el.querySelector('.vScore').style.color = color;
    const sets = el.querySelector('.vSets');
    sets.style.display = meta.sets ? 'block' : 'none';
    sets.textContent = `Sets: ${t.sets || 0}`;
  });
  renderClocks();
}

function renderClocks() {
  if (!game || !game.timer) return;
  const ms = timerDisplayMs(game.timer);
  const text = fmt(ms);
  $('clockLabel').textContent = text;
  $('vClock').textContent = text;
  $('vClock').classList.toggle('done', !game.timer.countUp && ms <= 0);
}
setInterval(() => { if (game && game.timer && game.timer.running) renderClocks(); }, 250);

// ---- wiring ----------------------------------------------------------------
$('leaveBtn').addEventListener('click', () => leave());
// The whole pad is +1; inner buttons handle their own actions.
[['padHome', 'home'], ['padAway', 'away']].forEach(([id, key]) => {
  $(id).addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    bump(key, 1);
  });
});
$('padHome').querySelector('.plusBig').addEventListener('click', () => bump('home', 1));
$('padAway').querySelector('.plusBig').addEventListener('click', () => bump('away', 1));
$('padHome').querySelectorAll('.setsRow button').forEach((b) =>
  b.addEventListener('click', () => bumpSets('home', Number(b.dataset.d))));
$('padAway').querySelectorAll('.setsRow button').forEach((b) =>
  b.addEventListener('click', () => bumpSets('away', Number(b.dataset.d))));
$('periodMinus').addEventListener('click', () => bumpPeriod(-1));
$('periodPlus').addEventListener('click', () => bumpPeriod(1));
$('clockToggle').addEventListener('click', toggleClock);
$('clockReset').addEventListener('click', resetClock);
$('hornBtn').addEventListener('click', () => { buzz(30); write({ horn: serverTimestamp() }); logEvent('horn'); });
$('resetBtn').addEventListener('click', resetGame);

async function setViewer(on) {
  viewerMode = on;
  if (code) show(on ? 'viewer' : 'remote');
  if (on) {
    logEvent('viewer_opened');
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  } else {
    try { wakeLock?.release(); } catch {}
    wakeLock = null;
  }
}
$('toViewer').addEventListener('click', () => setViewer(true));
$('toRemote').addEventListener('click', () => setViewer(false));
$('fullBtn').addEventListener('click', () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else el.requestFullscreen && el.requestFullscreen();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && viewerMode) setViewer(true); // re-acquire wake lock
});

// ---- boot ------------------------------------------------------------------
logEvent('web_open');
const urlCode = new URLSearchParams(location.search).get('code');
const saved = localStorage.getItem('sk:webCode');
if (urlCode && /^\d{4}$/.test(urlCode)) {
  join(urlCode);
} else if (saved) {
  $('rejoin').style.display = 'block';
  $('rejoin').textContent = `Rejoin ${saved}`;
  $('rejoin').addEventListener('click', () => join(saved));
}
</script>
</body>
